version: '3.7'
services:
  frontend:
    container_name: yuedsen-frontend
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    volumes:
      - ".:/app"
      - "/app/node_modules"
    ports:
      - ${PUBLIC_PORT}:3000
    networks:
      - app_network

networks:
  app_network:
    name: yuedsen_network
    external: true