version: '3.7'
services:
  frontend:
    container_name: yuedsen-frontend
    image: node:24.3.0
    restart: always
    command: "tail -f /dev/null"
    volumes:
      - ".:/app"
      - "/app/node_modules"
    ports:
      - ${PUBLIC_PORT}:3000
    networks:
      - app_network

networks:
  app_network:
    name: yuedsen_network
    external: true