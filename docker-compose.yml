version: '3.7'
services:
  frontend:
    container_name: yuedsen-frontend
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
      - BETTER_AUTH_SECRET=please_generate_a_secret_key
      - BETTER_AUTH_URL=http://localhost:3000
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/yuedsen_db
    volumes:
      - ".:/app"
      - "/app/node_modules"
    ports:
      - ${PUBLIC_PORT}:3000
    networks:
      - app_network

networks:
  app_network:
    name: yuedsen_network
    external: true